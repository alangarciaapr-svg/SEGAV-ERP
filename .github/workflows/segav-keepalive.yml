name: SEGAV Keep Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: segav-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ping Streamlit and Supabase
        env:
          KEEPALIVE_STREAMLIT_URL: ${{ vars.KEEPALIVE_STREAMLIT_URL || 'https://segav-erp.streamlit.app/' }}
          KEEPALIVE_SUPABASE_TABLE: ${{ vars.KEEPALIVE_SUPABASE_TABLE || 'segav_erp_clientes' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/keepalive.py
