name: SEGAV Keep Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: segav-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install keep-alive database client
        run: python -m pip install "psycopg[binary]>=3.2"
      - name: Ping Streamlit and Supabase
        env:
          KEEPALIVE_STREAMLIT_URL: ${{ vars.KEEPALIVE_STREAMLIT_URL || 'https://segav-erp.streamlit.app/' }}
          KEEPALIVE_REQUIRE_SUPABASE: "true"
          KEEPALIVE_SUPABASE_TABLE: ${{ vars.KEEPALIVE_SUPABASE_TABLE || 'segav_erp_clientes' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PG_DSN: ${{ secrets.PG_DSN }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/keepalive.py
