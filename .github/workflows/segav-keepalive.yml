name: SEGAV Keep Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: segav-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser keep-alive runtime
        run: |
          python -m pip install "playwright>=1.45"
          python -m playwright install --with-deps chromium
      - name: Wake Streamlit and touch Supabase through the app
        env:
          KEEPALIVE_STREAMLIT_URL: ${{ vars.KEEPALIVE_STREAMLIT_URL || 'https://segav-erp.streamlit.app/' }}
          KEEPALIVE_BROWSER: "true"
          KEEPALIVE_BROWSER_TIMEOUT_SECONDS: "540"
          KEEPALIVE_REQUIRE_SUPABASE: "false"
        run: python scripts/keepalive.py
